<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7">
<title>Hors ligne — Tapora</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2a211a;
    background: radial-gradient(40rem 30rem at 0% 0%, rgba(242,211,196,.7), transparent 60%),
                radial-gradient(40rem 30rem at 100% 100%, rgba(228,165,58,.22), transparent 60%), #f7f1e7; }
  .carte { max-width: 380px; width: 100%; text-align: center; background: #fffaf2; border-radius: 24px; padding: 34px 26px;
    box-shadow: 0 1px 0 #fff inset, 0 18px 40px -24px rgba(60,40,20,.45); }
  .sceau { width: 76px; height: 76px; animation: flotte 3s ease-in-out infinite; }
  h1 { font-family: Georgia, serif; font-size: 26px; margin-top: 18px; }
  p { color: #6b5d50; line-height: 1.55; margin-top: 8px; font-size: 15px; }
  button { margin-top: 22px; border: 0; border-radius: 999px; padding: 13px 24px; font: 600 15px/1 inherit;
    color: #fffaf2; background: linear-gradient(180deg, #cd6038, #b94c27); box-shadow: 0 10px 20px -10px rgba(194,85,47,.85); }
  @keyframes flotte { 50% { transform: translateY(-6px) rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { .sceau { animation: none; } }
</style>
</head>
<body>
  <div class="carte">
    <svg class="sceau" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="49" fill="#c2552f"/><g transform="translate(50 50) scale(.92) translate(-50 -54)"><g fill="none" stroke-width="6" stroke-linecap="round"><path d="M30.5 64A19.5 19.5 0 0 1 69.5 64" stroke="#f2d3c4"/><path d="M21.5 64A28.5 28.5 0 0 1 78.5 64" stroke="#e4a53a"/><path d="M12.5 64A37.5 37.5 0 0 1 87.5 64" stroke="#fffaf2"/></g><polygon points="50,51.9 52.48,58.08 59.13,58.53 54.02,62.81 55.64,69.27 50,65.72 44.36,69.27 45.98,62.81 40.87,58.53 47.52,58.08" fill="#fffaf2" stroke="#fffaf2" stroke-width="3" stroke-linejoin="round"/></g>
</svg>
    <h1>Pas de réseau</h1>
    <p>Le back-office a besoin d’internet pour afficher des chiffres à jour. Rien n’est perdu : réessayez dès que vous êtes reconnecté.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
  <script>addEventListener('online', () => location.reload())</script>
</body>
</html>
