# Plan de déploiement Render — https://render.com/docs/blueprint-spec
#
# Lien direct vers le bon écran, dépôt et branche déjà remplis :
# https://dashboard.render.com/blueprint/new?repo=https://github.com/coolminer11/f/tree/claude/tapora-expenses-profits-lsclxr
#
# Render lit ce fichier, crée le service et demande les valeurs marquées
# « sync: false ». Seule DATABASE_URL est indispensable au démarrage.
# SESSION_SECRET est tiré au hasard par Render : vous n'avez pas à y toucher.
services:
  - type: web
    name: tapora-backoffice
    runtime: node
    plan: free
    region: ohio            # le plus proche du Québec chez Render
    branch: claude/tapora-expenses-profits-lsclxr
    buildCommand: npm ci && npm run build
    # Les migrations en attente s'appliquent au démarrage, avant que le
    # serveur n'accepte une visite. C'est idempotent — schema_migrations note
    # ce qui est déjà passé — et ça retire une étape manuelle dont l'oubli
    # donnerait des écrans vides sans message d'erreur.
    startCommand: npm run db:migrer && npm run start
    healthCheckPath: /connexion
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      # Chaîne de connexion Supabase (Transaction pooler).
      - key: DATABASE_URL
        sync: false
      # Entreposage des reçus. Sans ces deux valeurs, les reçus sont écrits sur
      # le disque du serveur — qui est effacé à chaque redéploiement.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Envoi des documents. Sans ces deux valeurs, les envois sont simulés.
      - key: RESEND_API_KEY
        sync: false
      - key: COURRIEL_EXPEDITEUR
        sync: false
